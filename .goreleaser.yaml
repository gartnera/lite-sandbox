# GoReleaser configuration — https://goreleaser.com
#
# Run by .github/workflows/release.yaml after it tags a commit on main. Builds
# the lite-sandbox binary for Linux and macOS (amd64/arm64), packs each into
# lite-sandbox_<version>_<os>_<arch>.tar.gz, writes checksums.txt, and uploads
# everything to a draft GitHub release for the tag with GitHub-generated notes.
# The workflow then attests the assets and publishes the draft.
#
# `lite-sandbox update` (internal/selfupdate) and install.sh rely on the
# archive and checksum file names below — change them together.
#
# Local dry run (no tag or token needed):  goreleaser release --snapshot --clean
version: 2

project_name: lite-sandbox

builds:
  - id: lite-sandbox
    main: .
    binary: lite-sandbox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Embed the tag, commit, and commit date (see internal/version).
    ldflags:
      - -s -w
      - -X github.com/gartnera/lite-sandbox/internal/version.version={{ .Tag }}
      - -X github.com/gartnera/lite-sandbox/internal/version.commit={{ .ShortCommit }}
      - -X github.com/gartnera/lite-sandbox/internal/version.date={{ .CommitDate }}
    # Reproducible builds: stamp the binary with the commit time, not the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    # Keep in sync with selfupdate.AssetName and install.sh.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  # Keep in sync with selfupdate.ChecksumsFile and install.sh.
  name_template: checksums.txt
  algorithm: sha256

changelog:
  # GitHub's own release-notes generator: one line per merged pull request,
  # with authors, and a compare link to the previous release.
  use: github-native

release:
  github:
    owner: gartnera
    name: lite-sandbox
  # Leave the release as a draft: the workflow attests the assets and then
  # publishes it. Releases are immutable once published (a repository setting),
  # so nothing may be uploaded after that point.
  draft: true
  # A run that failed after creating the draft leaves it behind; the next run
  # starts over from a fresh one instead of adding to a half-uploaded release.
  # (GoReleaser matches drafts by release name, which is the tag here.)
  replace_existing_draft: true
  # A tag like v1.0.0-rc1 is published as a pre-release; plain tags are full releases.
  prerelease: auto
  # GitHub renders single newlines in release notes as line breaks, so keep
  # each paragraph on one line.
  header: |
    ## Install

    ```bash
    curl -fsSL https://github.com/gartnera/lite-sandbox/raw/{{ .Tag }}/install.sh | sh -s -- --version {{ .Tag }}
    ```

    Then run `lite-sandbox install` to configure your agent CLIs. To upgrade an existing install, run `lite-sandbox update --version {{ .Tag }}` and restart your agent.

    Every asset carries a signed [build provenance attestation](https://docs.github.com/en/actions/concepts/security/artifact-attestations) tying it to this repository and the workflow run that built it. The install script verifies it when the GitHub CLI is logged in. To verify an archive by hand:

    ```bash
    gh attestation verify {{ .ProjectName }}_{{ .Version }}_<os>_<arch>.tar.gz -R gartnera/lite-sandbox
    ```
