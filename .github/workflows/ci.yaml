name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same PR; pushes to main are keyed by sha so
# they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # go.mod pins an exact patch release (`go 1.26.0`), which setup-go treats
      # as an exact match and downloads on every run. Ask for the latest 1.26.x
      # instead so the runner image's preinstalled toolchain is used.
      - name: Resolve Go version
        id: go
        run: echo "version=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1.x/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Install bubblewrap
        run: |
          # The runner image ships a recent apt index, so try installing from it
          # first and only refresh the index if that fails (saves ~5s per run).
          timeout 120 sudo apt-get install -y --no-install-recommends bubblewrap && exit 0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y --no-install-recommends bubblewrap && exit 0
            echo "apt attempt $i timed out or failed, retrying..."
            sleep 5
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: go build -o lite-sandbox
      - name: Test
        run: go test ./...
        env:
          OS_SANDBOX_TESTS: "1"

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # go.mod pins an exact patch release (`go 1.26.0`), which setup-go treats
      # as an exact match and downloads on every run. Ask for the latest 1.26.x
      # instead so the runner image's preinstalled toolchain is used.
      - name: Resolve Go version
        id: go
        run: echo "version=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1.x/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Build
        run: go build -o lite-sandbox
      - name: Test
        run: go test ./...
        env:
          OS_SANDBOX_TESTS: "1"
