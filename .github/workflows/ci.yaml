name: CI

env:
  # Pinned Crush release for the installer end-to-end test (TestCrushEndToEnd).
  CRUSH_VERSION: 0.92.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: |
          for i in 1 2 3; do
            timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y bubblewrap && exit 0
            echo "apt attempt $i timed out or failed, retrying..."
            sleep 5
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install crush
        run: |
          os=$(uname -s)   # Linux / Darwin
          arch=$(uname -m) # x86_64 / arm64
          url="https://github.com/charmbracelet/crush/releases/download/v${CRUSH_VERSION}/crush_${CRUSH_VERSION}_${os}_${arch}.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/crush_${CRUSH_VERSION}_${os}_${arch}" >> "$GITHUB_PATH"
      - name: Build
        run: go build -o lite-sandbox
      - name: Test
        run: go test ./...
        env:
          OS_SANDBOX_TESTS: "1"
          CRUSH_E2E_TESTS: "1"

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install crush
        run: |
          os=$(uname -s)   # Linux / Darwin
          arch=$(uname -m) # x86_64 / arm64
          url="https://github.com/charmbracelet/crush/releases/download/v${CRUSH_VERSION}/crush_${CRUSH_VERSION}_${os}_${arch}.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/crush_${CRUSH_VERSION}_${os}_${arch}" >> "$GITHUB_PATH"
      - name: Build
        run: go build -o lite-sandbox
      - name: Test
        run: go test ./...
        env:
          OS_SANDBOX_TESTS: "1"
          CRUSH_E2E_TESTS: "1"
