name: CI

env:
  # Pinned Crush release for the installer end-to-end test (TestCrushEndToEnd).
  CRUSH_VERSION: 0.92.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same PR; pushes to main are keyed by sha so
# they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: |
          # The runner image ships a recent apt index, so try installing from it
          # first and only refresh the index if that fails (saves ~5s per run).
          timeout 120 sudo apt-get install -y --no-install-recommends bubblewrap && exit 0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y --no-install-recommends bubblewrap && exit 0
            echo "apt attempt $i timed out or failed, retrying..."
            sleep 5
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: go build -o lite-sandbox
      - name: Test
        run: go test ./...
        env:
          OS_SANDBOX_TESTS: "1"
      - name: Cache crush
        id: crush-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/crush
          key: crush-${{ env.CRUSH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install crush
        if: steps.crush-cache.outputs.cache-hit != 'true'
        run: |
          os=$(uname -s)   # Linux / Darwin
          arch=$(uname -m) # x86_64 / arm64
          url="https://github.com/charmbracelet/crush/releases/download/v${CRUSH_VERSION}/crush_${CRUSH_VERSION}_${os}_${arch}.tar.gz"
          mkdir -p "$RUNNER_TEMP/crush"
          curl -fsSL "$url" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/crush"
      - name: Crush end-to-end test
        run: |
          export PATH="$RUNNER_TEMP/crush:$PATH"
          crush --version
          go test ./cmd/ -run TestCrushEndToEnd -v
        env:
          CRUSH_E2E_TESTS: "1"

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o lite-sandbox
      - name: Test
        run: go test ./...
        env:
          OS_SANDBOX_TESTS: "1"
      - name: Cache crush
        id: crush-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/crush
          key: crush-${{ env.CRUSH_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install crush
        if: steps.crush-cache.outputs.cache-hit != 'true'
        run: |
          os=$(uname -s)   # Linux / Darwin
          arch=$(uname -m) # x86_64 / arm64
          url="https://github.com/charmbracelet/crush/releases/download/v${CRUSH_VERSION}/crush_${CRUSH_VERSION}_${os}_${arch}.tar.gz"
          mkdir -p "$RUNNER_TEMP/crush"
          curl -fsSL "$url" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/crush"
      - name: Crush end-to-end test
        run: |
          export PATH="$RUNNER_TEMP/crush:$PATH"
          crush --version
          go test ./cmd/ -run TestCrushEndToEnd -v
        env:
          CRUSH_E2E_TESTS: "1"
